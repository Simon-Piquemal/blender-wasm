# Service du build `demo/dist/` — Blender wasm, tel que Phasen l'ouvre.
#
# ── LA RAISON D'ÊTRE DE CE FICHIER ────────────────────────────────────────
#
# Blender compilé en WebAssembly utilise des threads (pthreads), donc
# `SharedArrayBuffer`, que les navigateurs ne donnent qu'à une page en
# ISOLATION CROSS-ORIGIN. Sans les deux en-têtes ci-dessous, la page se charge,
# l'onglet s'ouvre, et rien ne démarre : `SharedArrayBuffer is not defined`.
#
# `vite.config.js` les pose déjà — mais seulement pour `vite dev` et
# `vite preview`, c'est-à-dire jamais en production. Un hébergement statique
# ordinaire (nginx par défaut, Dokploy « Static », un bucket) ne les envoie pas.
# C'est exactement le genre de réglage qui fait « ça marche en local, pas sur le
# serveur », sans qu'aucun journal serveur ne dise quoi que ce soit : le défaut
# est entièrement côté navigateur.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ── Isolation cross-origin ────────────────────────────────────────────
    # `always` : sans lui, nginx omet ces en-têtes sur les réponses non-2xx
    # (304 Not Modified en tête), et un simple rechargement suffirait alors à
    # casser l'isolation — panne intermittente, la pire à diagnostiquer.
    add_header Cross-Origin-Opener-Policy   same-origin  always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # Sous `require-corp`, une ressource même de MÊME origine doit s'annoncer
    # chargeable. Le wasm et les archives passent par `fetch`, ce qui suffirait,
    # mais l'annoncer coûte une ligne et couvre les balises.
    add_header Cross-Origin-Resource-Policy cross-origin always;

    # ── Types MIME des artefacts ──────────────────────────────────────────
    # `.zst` est inconnu de la table nginx : il sortirait en
    # `application/octet-stream`. C'est sans conséquence — le code les récupère
    # par `fetch` et les décompresse lui-même (cf. demo/src/main.js) — mais
    # autant que la réponse dise la vérité.
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js;
        application/wasm                      wasm;
        application/zstd                      zst;
        application/x-tar                     tar;
        application/json                      json;
        image/svg+xml                         svg;
        image/png                             png;
        model/gltf-binary                     glb;
    }
    default_type application/octet-stream;

    # ⚠️ NE PAS activer gzip sur ce site. `blender.wasm.zst` (21 Mo) et
    # `assets.tar.zst` sont DÉJÀ compressés : les recompresser brûle du CPU à
    # chaque requête pour ne rien gagner, et sur un VPS modeste ça se voit au
    # premier chargement.
    gzip off;

    # Gros fichiers : on les envoie sans les recopier en espace utilisateur.
    sendfile on;
    tcp_nopush on;

    # ── Cache ─────────────────────────────────────────────────────────────
    # Les binaires ne changent qu'à une reconstruction de Blender : un an de
    # cache immuable évite de retélécharger 30 Mo à chaque ouverture d'onglet.
    location ~* \.(wasm|zst|tar|glb)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy   same-origin  always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
    }

    # `assets/` porte des noms hachés par Vite : idem, immuable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy   same-origin  always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
    }

    # La page, elle, ne doit JAMAIS être servie depuis le cache : c'est elle qui
    # pointe vers les noms hachés du déploiement courant. Mise en cache, un
    # navigateur continuerait d'appeler les fichiers de la version précédente
    # après un redéploiement — 404 sur des assets, page blanche.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Cross-Origin-Opener-Policy   same-origin  always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    # Le modèle arrive en paramètre d'URL (`?model=…&format=…`) : tous les
    # chemins rendent la même page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sonde pour l'orchestrateur — répond sans toucher au disque.
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}';
    }
}
